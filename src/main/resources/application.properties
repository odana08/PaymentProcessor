spring.application.name=fee-calculator

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/fee_calculator?serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:fee_app}
spring.datasource.password=${DB_PASSWORD:fee_app_password}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_batch_fetch_size=100

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100

server.error.include-message=never
server.error.include-stacktrace=never

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
